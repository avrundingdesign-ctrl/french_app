name: FrenchApp
options:
  bundleIdPrefix: design.avrunding
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Deutsch ist Entwicklungssprache (Keys = deutsche Texte),
  # Französisch kommt als Übersetzung im String-Katalog dazu.
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Ohne Team fragt Xcode nach jedem `xcodegen generate` wieder nach,
    # weil die .xcodeproj generiert und gitignored ist.
    DEVELOPMENT_TEAM: 8698DN5A64
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  FrenchApp:
    type: application
    platform: iOS
    sources:
      - path: FrenchApp
    info:
      path: FrenchApp/Info.plist
      properties:
        CFBundleDisplayName: Français
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Adresse des KI-Proxys (server/). Leer = kein Proxy-Pfad; dann läuft
        # der KI-Partner nur über Apple Intelligence oder einen eigenen Key.
        AIProxyBaseURL: $(AI_PROXY_BASE_URL)
        # Aussprache-Training: Aufnahme + Spracherkennung (bevorzugt auf dem Gerät).
        NSMicrophoneUsageDescription: "Das Mikrofon wird für die Sprechübungen gebraucht, um deine Aussprache zu bewerten."
        NSSpeechRecognitionUsageDescription: "Die Spracherkennung wandelt deine Sprechübungen in Text um, damit die App deine Aussprache bewerten kann — wenn möglich direkt auf dem Gerät."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.avrunding.frenchapp
        CODE_SIGN_ENTITLEMENTS: FrenchApp/FrenchApp.entitlements
        # Nach dem Deploy des Workers hier die Adresse eintragen, z. B.
        # https://frenchapp-ai-proxy.<dein-subdomain>.workers.dev
        # Leer lassen heißt: kein Proxy-Pfad (siehe server/README.md).
        AI_PROXY_BASE_URL: ""
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FrenchAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrenchAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: FrenchApp

schemes:
  FrenchApp:
    build:
      targets:
        FrenchApp: all
        FrenchAppTests: [test]
    run:
      config: Debug
      # Lokales StoreKit-Testing (Paywall im Simulator ohne App Store Connect).
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FrenchAppTests
